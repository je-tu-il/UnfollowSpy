name: Web checks
on:
  push:
  pull_request:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/core.mjs
      - run: node tests/browser.mjs "$(command -v google-chrome)"
